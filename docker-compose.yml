services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: kiri_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_kiri:/var/lib/postgresql/data
    networks:
      - kiri_network

  # Almacenamiento de objetos (imágenes) compatible con S3
  minio:
    image: chainguard/minio:latest
    container_name: kiri_minio
    user: "65532:65532"   # usuario 'nonroot' de la imagen (evita "access denied" en Windows)
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3 (la usa el backend)
      - "9001:9001"   # Consola web de administración
    volumes:
      - ./minio_data:/data
    networks:
      - kiri_network

volumes:
  postgres_kiri:

networks:
  kiri_network:
    driver: bridge
